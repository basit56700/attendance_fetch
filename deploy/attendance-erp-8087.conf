server {
    listen 8087;
    listen [::]:8087;
    server_name _;

    root /home/shoaib/web/gcs/private/attendance_erp/public;
    index index.php index.html;
    charset utf-8;

    access_log /var/log/nginx/attendance-erp-8087-access.log;
    error_log  /var/log/nginx/attendance-erp-8087-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass unix:/run/php/php8.4-fpm-attendance-erp.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

