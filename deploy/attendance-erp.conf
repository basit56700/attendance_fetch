[attendance-erp]
user = shoaib
group = shoaib

listen = /run/php/php8.4-fpm-attendance-erp.sock
listen.owner = shoaib
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.max_requests = 1000
pm.process_idle_timeout = 10s

php_admin_value[upload_tmp_dir] = /home/shoaib/tmp
php_admin_value[session.save_path] = /home/shoaib/tmp
php_admin_value[open_basedir] = /home/shoaib/.composer:/home/shoaib/web/gcs/private/attendance_erp:/home/shoaib/tmp:/tmp:/usr/share:/bin:/usr/bin:/usr/local/bin:/opt

env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /home/shoaib/tmp
env[TMPDIR] = /home/shoaib/tmp
env[TEMP] = /home/shoaib/tmp

